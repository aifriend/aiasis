name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is not listed: requirements.txt pins audioop-lts, which only
        # installs on Python 3.13+ (no environment marker on that line).
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: System audio lib for sounddevice
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install deps (CPU torch)
        run: |
          uv venv -p ${{ matrix.python-version }} .venv
          uv pip install -p .venv/bin/python --torch-backend=cpu -r requirements.txt pytest
      - name: Run unit tests
        run: .venv/bin/python -m pytest -q
